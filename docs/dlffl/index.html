<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Weekly Booth, Dewart Lake FFL</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0e1116;color:#e4e7ec;font:17px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:26px 18px 64px}
.eyebrow{color:#8b93a1;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px}
h1{font-size:27px;line-height:1.24;margin:0 0 20px;color:#fff;letter-spacing:-.01em}
h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#7fb2ff;margin:36px 0 14px;padding-bottom:8px;border-bottom:1px solid #232a37}
p{margin:0 0 13px}
.who{color:#ffcf7a;font-weight:700}
.box{border:1px solid #28303f;border-radius:10px;background:#151a24;padding:13px 15px;margin:20px 0 15px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-weight:700;color:#fff;font-size:18px}
.row+.row{margin-top:4px}
.marg{margin-top:9px;padding-top:8px;border-top:1px solid #28303f;color:#8b93a1;font-size:14px;letter-spacing:.02em}
ol{padding-left:22px;margin:0 0 13px}
li{margin-bottom:8px}
.note{color:#8b93a1;font-size:14px}
.foot{margin-top:42px;padding-top:16px;border-top:1px solid #232a37;color:#8b93a1;font-size:14px}
a{color:#7fb2ff;text-decoration:none}
a:hover{text-decoration:underline}
@media (max-width:480px){h1{font-size:23px}body{font-size:16px}.row{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
<p class="eyebrow">The Weekly Booth</p><h1>Dewart Lake FFL</h1><p><a href="https://slentz9090.github.io/weekly-booth/dlffl/week-1.html">Week 1</a></p><p class="foot"><a href="https://slentz9090.github.io/weekly-booth/">Both leagues</a></p>
</div>
</body>
</html>
